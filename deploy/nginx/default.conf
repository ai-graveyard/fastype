server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 产物几乎全是文本（JS / CSS / HTML / JSON），压缩的收益比什么都大。
    # PNG 已经压过了，不重复压。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # 注意：子 location 里只要出现一条 add_header，从上层继承来的 add_header 会被整体顶掉。
    # 所以下面每个自己设了缓存头的 location 都要把这几行原样重复一遍。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # AI 的 API Key 就存在这个源的 localStorage 里，不允许被别人套进 iframe。
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # 这个应用不用任何设备能力。
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # /_next/static/ 下的文件名都带内容哈希，内容一变文件名就变，可以永久缓存。
    # `^~` 是必须的：否则下面那条正则 location 会抢先匹配，把它降回 30 天。
    location ^~ /_next/static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # next.config.ts 里 trailingSlash: true，页面产物是 /path/index.html，
    # 依次尝试目录、去掉扩展名的静态文件，都找不到就交给 error_page 处理（保留 404 状态码）。
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # HTML 不能被缓存住，否则发版之后用户会一直拿到旧壳子，去引用已经删掉的 chunk。
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # nginx 自带的 mime.types 里没有 .webmanifest，会落到 application/octet-stream；
    # 配合上面的 nosniff，浏览器会直接拒收这份 manifest，PWA 装不上。
    # 这里用 default_type 兜底（只在扩展名查不到类型时生效，不会动其它 MIME）。
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # public/ 下的图标和截图文件名不带哈希，只做中等时长缓存。
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webmanifest)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
}
