server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # next.config.ts 里 trailingSlash: true，页面产物是 /path/index.html，
    # 依次尝试目录、去掉扩展名的静态文件，都找不到就交给 error_page 处理（保留 404 状态码）。
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webmanifest)$ {
        expires 30d;
        access_log off;
    }
}
