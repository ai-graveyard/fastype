# 不写这行的话，compose 拿所在目录名当项目名，也就是 "deploy"。同一台服务器上
# 另一个项目的 compose 同样放在 deploy/ 目录下时，两边会撞成同一个项目：compose
# 把对方的容器当成本项目的孤儿（日志里那一长串 orphan containers 警告就是这么来的），
# 一旦有谁执行 --remove-orphans，就会把另一个项目整套删掉。
name: fastype

services:
  fastype:
    # 就地构建，不依赖任何镜像仓库。首次或代码更新后用 `docker compose up -d --build`。
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-graveyard/fastype:latest
    container_name: fastype
    restart: unless-stopped
    ports:
      - "${FASTYPE_PORT:-3000}:80"
