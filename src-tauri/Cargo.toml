[package]
name = "fastype"
version = "0.1.0"
description = "FasType 桌面客户端"
authors = ["FasType contributors"]
license = "MIT"
repository = "https://github.com/ai-graveyard/fastype"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fastype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
